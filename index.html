<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrição App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F7F1;
      --ink: #1F2B1E;
      --ink-soft: #5B6B57;
      --linha: #DDE3D3;
      --card: #FFFFFF;
      --kcal: #2F5233;
      --proteina: #C1542C;
      --carboidrato: #D9A441;
      --gordura: #6B7A3A;
      --raio: 14px;
      --raio-pequeno: 8px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--ink);
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 88px;
      -webkit-font-smoothing: antialiased;
    }

    h2 {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 26px;
      margin: 4px 0 20px;
      letter-spacing: -0.01em;
    }

    h3 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 17px;
      margin: 24px 0 10px;
      color: var(--ink);
    }

    h4 {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 14px;
      margin: 0 0 10px;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-soft);
      margin: 14px 0 4px;
    }

    input, select {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      padding: 12px 14px;
      width: 100%;
      border: 1.5px solid var(--linha);
      border-radius: var(--raio-pequeno);
      background: var(--card);
      color: var(--ink);
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--kcal);
    }

    button {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 13px;
      width: 100%;
      background: var(--kcal);
      color: white;
      border: none;
      border-radius: var(--raio-pequeno);
      margin-top: 10px;
      cursor: pointer;
    }

    button:active { opacity: 0.85; }

    /* ---------- Navegação inferior fixa ---------- */
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card);
      border-top: 1px solid var(--linha);
      display: flex;
      max-width: 480px;
      margin: 0 auto;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      z-index: 10;
    }

    nav button {
      flex: 1;
      background: none;
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 600;
      margin: 0;
      padding: 6px 4px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    nav button svg { width: 22px; height: 22px; stroke: var(--ink-soft); fill: none; stroke-width: 1.8; }

    nav button.ativo { color: var(--kcal); }
    nav button.ativo svg { stroke: var(--kcal); }

    /* ---------- Listas de sugestão / favoritos ---------- */
    #sugestoes, #favoritos {
      background: var(--card);
      border-radius: var(--raio-pequeno);
      overflow: hidden;
      margin-top: 4px;
    }
    #sugestoes div, #favoritos div {
      padding: 12px 14px;
      border-bottom: 1px solid var(--linha);
      font-size: 15px;
    }
    #sugestoes div:last-child, #favoritos div:last-child { border-bottom: none; }
    #favoritos div { cursor: pointer; }
    #favoritos div:active { background: var(--bg); }
    #favoritos p, #sugestoes p { padding: 12px 14px; color: var(--ink-soft); font-size: 14px; }

    /* ---------- Itens da refeição atual ---------- */
    #itens { list-style: none; padding: 0; margin: 0; }
    #itens li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      padding: 10px 14px;
      border-radius: var(--raio-pequeno);
      margin-bottom: 6px;
      font-size: 15px;
    }
    #itens li button {
      width: 26px; height: 26px;
      padding: 0;
      margin: 0;
      background: var(--bg);
      color: var(--ink-soft);
      border-radius: 50%;
      font-size: 14px;
      line-height: 1;
    }

    /* ---------- Totais ---------- */
    #totais {
      background: var(--card);
      padding: 16px;
      border-radius: var(--raio);
      margin-top: 14px;
      border: 1px solid var(--linha);
    }
    #totais strong {
      font-family: 'Fraunces', serif;
      font-size: 15px;
      display: block;
      margin-bottom: 6px;
      color: var(--ink-soft);
      font-weight: 500;
    }
    #totalKcal {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 28px;
      color: var(--kcal);
      margin: 2px 0;
    }
    #totalMacros {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--ink-soft);
    }

    .checkbox-linha { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
    .checkbox-linha input { width: auto; }
    .checkbox-linha label { margin: 0; }

    #mensagemSalvar { font-size: 14px; color: var(--kcal); font-weight: 500; min-height: 20px; }

    /* ---------- Barras de progresso ---------- */
    .linha-progresso { margin-bottom: 14px; }
    .linha-progresso .rotulo {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 5px;
    }
    .linha-progresso .rotulo span:first-child { font-weight: 600; }
    .linha-progresso .rotulo span:last-child {
      font-family: 'JetBrains Mono', monospace;
      color: var(--ink-soft);
    }
    .barra-fundo { background: var(--linha); border-radius: 6px; height: 10px; overflow: hidden; }
    .barra-preenchida { height: 100%; border-radius: 6px; }

    .progresso-bloco {
      background: var(--card);
      border: 1px solid var(--linha);
      border-radius: var(--raio);
      padding: 16px;
      margin-bottom: 10px;
    }
    .progresso-bloco h4 { margin-bottom: 12px; }

    /* ---------- Histórico ---------- */
    .historico-item {
      background: var(--card);
      border: 1px solid var(--linha);
      border-radius: var(--raio);
      padding: 14px;
      margin-bottom: 10px;
    }
    .historico-item strong { font-family: 'Fraunces', serif; font-size: 16px; }
    .historico-item small { color: var(--ink-soft); font-size: 12px; }
    .historico-item .macros {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      margin: 6px 0;
      color: var(--ink);
    }

    #btnExportarCSV { background: var(--card); color: var(--kcal); border: 1.5px solid var(--kcal); }
  </style>
</head>
<body>

  <!-- ===================== TELA: LANÇAR ===================== -->
  <div id="viewLancar">
    <h2>Lançar refeição</h2>

    <label for="tipoRefeicao">Horário</label>
    <select id="tipoRefeicao">
      <option value="Café da manhã">Café da manhã</option>
      <option value="Almoço">Almoço</option>
      <option value="Lanche da tarde">Lanche da tarde</option>
      <option value="Jantar">Jantar</option>
      <option value="Ceia">Ceia</option>
    </select>

    <label for="nomePrato">Nome da refeição</label>
    <input type="text" id="nomePrato" placeholder="Ex: Tapioca de frango">

    <h3>Favoritos</h3>
    <div id="favoritos">Carregando favoritos...</div>

    <h3>Ingredientes</h3>
    <input type="text" id="busca" placeholder="Buscar ingrediente...">
    <div id="sugestoes"></div>

    <div id="selecao" style="display:none;">
      <p id="ingredienteSelecionado"></p>
      <input type="number" id="quantidade" placeholder="Quantidade em gramas">
      <button id="btnAdicionar">Adicionar à refeição</button>
    </div>

    <h3>Itens desta refeição</h3>
    <ul id="itens"></ul>

    <div id="totais">
      <strong>Total da refeição</strong>
      <div id="totalKcal">0 kcal</div>
      <div id="totalMacros">P: 0g · C: 0g · G: 0g</div>
    </div>

    <div class="checkbox-linha">
      <input type="checkbox" id="marcarFavorito">
      <label for="marcarFavorito">Salvar também como favorito</label>
    </div>

    <button id="btnSalvar">Salvar refeição</button>
    <p id="mensagemSalvar"></p>
  </div>

  <!-- ===================== TELA: PROGRESSO ===================== -->
  <div id="viewProgresso" style="display:none;">
    <h2>Progresso de hoje</h2>
    <div id="progressoDiario">Carregando...</div>

    <h3>Por refeição (hoje)</h3>
    <div id="progressoPorTipo"></div>

    <h3>Últimos 7 dias</h3>
    <div id="progressoSemanal">Carregando...</div>
  </div>

  <!-- ===================== TELA: HISTÓRICO ===================== -->
  <div id="viewHistorico" style="display:none;">
    <h2>Histórico</h2>
    <button id="btnExportarCSV">Exportar CSV</button>
    <div id="listaHistorico">Carregando...</div>
  </div>

  <!-- ===================== NAVEGAÇÃO INFERIOR ===================== -->
  <nav>
    <button id="navLancar" class="ativo">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
      Lançar
    </button>
    <button id="navProgresso">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3" stroke-linecap="round"/></svg>
      Progresso
    </button>
    <button id="navHistorico">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg>
      Histórico
    </button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://lgrlzbedortavlokyvag.supabase.co";
    const supabaseKey = "sb_publishable_ydgbE3WSndTe_1hn05pylQ_zJ30jfMR";
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    const CORES = { kcal: "#2F5233", proteina_g: "#C1542C", carboidrato_g: "#D9A441", gordura_g: "#6B7A3A" };
    const ROTULOS = { kcal: "Calorias", proteina_g: "Proteína (g)", carboidrato_g: "Carboidrato (g)", gordura_g: "Gordura (g)" };

    let ingredienteAtual = null;
    let itensRefeicao = [];
    let historicoCache = [];

    // ---------- NAVEGAÇÃO ----------
    document.getElementById("navLancar").addEventListener("click", () => mostrarTela("lancar"));
    document.getElementById("navProgresso").addEventListener("click", () => mostrarTela("progresso"));
    document.getElementById("navHistorico").addEventListener("click", () => mostrarTela("historico"));

    function mostrarTela(tela) {
      document.getElementById("viewLancar").style.display = tela === "lancar" ? "block" : "none";
      document.getElementById("viewProgresso").style.display = tela === "progresso" ? "block" : "none";
      document.getElementById("viewHistorico").style.display = tela === "historico" ? "block" : "none";
      document.getElementById("navLancar").classList.toggle("ativo", tela === "lancar");
      document.getElementById("navProgresso").classList.toggle("ativo", tela === "progresso");
      document.getElementById("navHistorico").classList.toggle("ativo", tela === "historico");
      if (tela === "historico") carregarHistorico();
      if (tela === "progresso") {
        carregarProgressoDoDia();
        carregarProgressoSemanal();
      }
    }

    // ---------- FAVORITOS ----------
    async function carregarFavoritos() {
      const div = document.getElementById("favoritos");

      const { data, error } = await supabaseClient
        .from("refeicoes")
        .select("id, nome, tipo_refeicao, data_hora")
        .eq("is_favorito", true)
        .order("data_hora", { ascending: false });

      if (error) { div.innerHTML = "<p>Erro ao carregar favoritos.</p>"; return; }
      if (data.length === 0) { div.innerHTML = "<p>Nenhum favorito ainda.</p>"; return; }

      div.innerHTML = "";
      data.forEach((fav) => {
        const item = document.createElement("div");
        item.textContent = "⭐ " + fav.nome;
        item.onclick = () => carregarItensDoFavorito(fav.id, fav.nome, fav.tipo_refeicao);
        div.appendChild(item);
      });
    }

    async function carregarItensDoFavorito(refeicaoId, nome, tipoRefeicao) {
      const { data, error } = await supabaseClient
        .from("itens_refeicao")
        .select("quantidade_g, ingredientes(id, nome, kcal, proteina_g, carboidrato_g, gordura_g)")
        .eq("refeicao_id", refeicaoId);

      if (error) { alert("Erro ao carregar favorito: " + error.message); return; }

      itensRefeicao = data.map((item) => {
        const ing = item.ingredientes;
        const fator = item.quantidade_g / 100;
        return {
          ingrediente_id: ing.id,
          nome: ing.nome,
          quantidade_g: item.quantidade_g,
          kcal: (ing.kcal || 0) * fator,
          proteina_g: (ing.proteina_g || 0) * fator,
          carboidrato_g: (ing.carboidrato_g || 0) * fator,
          gordura_g: (ing.gordura_g || 0) * fator,
        };
      });

      document.getElementById("nomePrato").value = nome;
      if (tipoRefeicao) document.getElementById("tipoRefeicao").value = tipoRefeicao;
      renderizarLista();
    }

    // ---------- BUSCA DE INGREDIENTES ----------
    document.getElementById("busca").addEventListener("input", async (e) => {
      const termo = e.target.value.trim();
      const div = document.getElementById("sugestoes");
      if (termo.length < 2) { div.innerHTML = ""; return; }

      const { data, error } = await supabaseClient
        .from("ingredientes")
        .select("id, nome, kcal, proteina_g, carboidrato_g, gordura_g")
        .ilike("nome", `%${termo}%`)
        .limit(10);

      if (error) { div.innerHTML = "<p>Erro na busca.</p>"; return; }

      div.innerHTML = "";
      data.forEach((ing) => {
        const item = document.createElement("div");
        item.textContent = ing.nome;
        item.onclick = () => selecionarIngrediente(ing);
        div.appendChild(item);
      });
    });

    function selecionarIngrediente(ing) {
      ingredienteAtual = ing;
      document.getElementById("ingredienteSelecionado").textContent = "Selecionado: " + ing.nome;
      document.getElementById("selecao").style.display = "block";
      document.getElementById("sugestoes").innerHTML = "";
      document.getElementById("busca").value = "";
    }

    document.getElementById("btnAdicionar").addEventListener("click", () => {
      const qtd = parseFloat(document.getElementById("quantidade").value);
      if (!ingredienteAtual || !qtd || qtd <= 0) {
        alert("Escolha um ingrediente e uma quantidade válida.");
        return;
      }

      const fator = qtd / 100;
      itensRefeicao.push({
        ingrediente_id: ingredienteAtual.id,
        nome: ingredienteAtual.nome,
        quantidade_g: qtd,
        kcal: (ingredienteAtual.kcal || 0) * fator,
        proteina_g: (ingredienteAtual.proteina_g || 0) * fator,
        carboidrato_g: (ingredienteAtual.carboidrato_g || 0) * fator,
        gordura_g: (ingredienteAtual.gordura_g || 0) * fator,
      });

      ingredienteAtual = null;
      document.getElementById("selecao").style.display = "none";
      document.getElementById("quantidade").value = "";
      renderizarLista();
    });

    function calcularTotais() {
      return itensRefeicao.reduce((totais, item) => {
        totais.kcal += item.kcal;
        totais.proteina_g += item.proteina_g;
        totais.carboidrato_g += item.carboidrato_g;
        totais.gordura_g += item.gordura_g;
        return totais;
      }, { kcal: 0, proteina_g: 0, carboidrato_g: 0, gordura_g: 0 });
    }

    function renderizarLista() {
      const ul = document.getElementById("itens");
      ul.innerHTML = "";

      itensRefeicao.forEach((item, index) => {
        const li = document.createElement("li");
        li.innerHTML = `<span>${item.nome} (${item.quantidade_g}g)</span>
          <button onclick="removerItem(${index})">×</button>`;
        ul.appendChild(li);
      });

      const totais = calcularTotais();
      document.getElementById("totalKcal").textContent = totais.kcal.toFixed(0) + " kcal";
      document.getElementById("totalMacros").textContent =
        `P: ${totais.proteina_g.toFixed(1)}g · C: ${totais.carboidrato_g.toFixed(1)}g · G: ${totais.gordura_g.toFixed(1)}g`;
    }

    function removerItem(index) {
      itensRefeicao.splice(index, 1);
      renderizarLista();
    }

    // chave: "kcal" | "proteina_g" | "carboidrato_g" | "gordura_g" — usa a cor certa por macro
    function barraProgresso(chave, valor, meta) {
      const percentual = meta ? Math.min((valor / meta) * 100, 100) : 0;
      return `
        <div class="linha-progresso">
          <div class="rotulo">
            <span>${ROTULOS[chave]}</span>
            <span>${valor.toFixed(1)} / ${meta ?? "?"}</span>
          </div>
          <div class="barra-fundo">
            <div class="barra-preenchida" style="width:${percentual}%; background:${CORES[chave]}"></div>
          </div>
        </div>
      `;
    }

    document.getElementById("btnSalvar").addEventListener("click", async () => {
      if (itensRefeicao.length === 0) {
        alert("Adicione pelo menos um ingrediente antes de salvar.");
        return;
      }

      const tipoRefeicao = document.getElementById("tipoRefeicao").value;
      const nomePrato = document.getElementById("nomePrato").value.trim();
      const marcarFavorito = document.getElementById("marcarFavorito").checked;

      if (!nomePrato) {
        alert("Dê um nome para essa refeição (ex: Tapioca de frango).");
        return;
      }

      const { data: refeicao, error: erroRefeicao } = await supabaseClient
        .from("refeicoes")
        .insert({ nome: nomePrato, tipo_refeicao: tipoRefeicao, is_favorito: marcarFavorito })
        .select()
        .single();

      if (erroRefeicao) {
        document.getElementById("mensagemSalvar").textContent = "Erro ao salvar: " + erroRefeicao.message;
        return;
      }

      const itensParaSalvar = itensRefeicao.map((item) => ({
        refeicao_id: refeicao.id,
        ingrediente_id: item.ingrediente_id,
        quantidade_g: item.quantidade_g,
      }));

      const { error: erroItens } = await supabaseClient
        .from("itens_refeicao")
        .insert(itensParaSalvar);

      if (erroItens) {
        document.getElementById("mensagemSalvar").textContent = "Erro ao salvar itens: " + erroItens.message;
        return;
      }

      document.getElementById("mensagemSalvar").textContent = "Refeição salva. Veja o progresso na aba Progresso.";

      itensRefeicao = [];
      document.getElementById("marcarFavorito").checked = false;
      document.getElementById("nomePrato").value = "";
      renderizarLista();
      carregarFavoritos();
    });

    // ---------- PROGRESSO DO DIA ----------
    async function carregarProgressoDoDia() {
      const divDiario = document.getElementById("progressoDiario");
      const divPorTipo = document.getElementById("progressoPorTipo");
      divDiario.innerHTML = "Carregando...";
      divPorTipo.innerHTML = "";

      const inicioHoje = new Date();
      inicioHoje.setHours(0, 0, 0, 0);

      const { data: refeicoesHoje, error: erroRef } = await supabaseClient
        .from("refeicoes")
        .select("id, tipo_refeicao")
        .gte("data_hora", inicioHoje.toISOString());

      if (erroRef) { divDiario.innerHTML = "<p>Erro ao carregar progresso.</p>"; return; }

      if (refeicoesHoje.length === 0) {
        divDiario.innerHTML = "<p>Nenhuma refeição lançada hoje ainda.</p>";
        divPorTipo.innerHTML = "";
        return;
      }

      const idsHoje = refeicoesHoje.map((r) => r.id);
      const tipoPorId = Object.fromEntries(refeicoesHoje.map((r) => [r.id, r.tipo_refeicao]));

      const { data: itens, error: erroItens } = await supabaseClient
        .from("itens_refeicao")
        .select("refeicao_id, quantidade_g, ingredientes(kcal, proteina_g, carboidrato_g, gordura_g)")
        .in("refeicao_id", idsHoje);

      if (erroItens) { divDiario.innerHTML = "<p>Erro ao carregar itens de hoje.</p>"; return; }

      const totalDia = { kcal: 0, proteina_g: 0, carboidrato_g: 0, gordura_g: 0 };
      const totalPorTipo = {};

      itens.forEach((item) => {
        const fator = item.quantidade_g / 100;
        const ing = item.ingredientes;
        const tipo = tipoPorId[item.refeicao_id] || "Sem horário";

        if (!totalPorTipo[tipo]) totalPorTipo[tipo] = { kcal: 0, proteina_g: 0, carboidrato_g: 0, gordura_g: 0 };

        const valores = {
          kcal: (ing?.kcal || 0) * fator,
          proteina_g: (ing?.proteina_g || 0) * fator,
          carboidrato_g: (ing?.carboidrato_g || 0) * fator,
          gordura_g: (ing?.gordura_g || 0) * fator,
        };

        totalDia.kcal += valores.kcal;
        totalDia.proteina_g += valores.proteina_g;
        totalDia.carboidrato_g += valores.carboidrato_g;
        totalDia.gordura_g += valores.gordura_g;

        totalPorTipo[tipo].kcal += valores.kcal;
        totalPorTipo[tipo].proteina_g += valores.proteina_g;
        totalPorTipo[tipo].carboidrato_g += valores.carboidrato_g;
        totalPorTipo[tipo].gordura_g += valores.gordura_g;
      });

      const { data: metaDia } = await supabaseClient
        .from("metas")
        .select("*")
        .eq("tipo", "diaria")
        .maybeSingle();

      if (!metaDia) {
        divDiario.innerHTML = "<p>Nenhuma meta diária cadastrada.</p>";
      } else {
        divDiario.innerHTML = `
          <div class="progresso-bloco">
            ${barraProgresso("kcal", totalDia.kcal, metaDia.kcal_meta)}
            ${barraProgresso("proteina_g", totalDia.proteina_g, metaDia.proteina_meta_g)}
            ${barraProgresso("carboidrato_g", totalDia.carboidrato_g, metaDia.carboidrato_meta_g)}
            ${barraProgresso("gordura_g", totalDia.gordura_g, metaDia.gordura_meta_g)}
          </div>
        `;
      }

      const { data: metasPorTipo } = await supabaseClient
        .from("metas")
        .select("*")
        .eq("tipo", "refeicao");

      const metaPorNome = Object.fromEntries((metasPorTipo || []).map((m) => [m.nome_refeicao, m]));

      divPorTipo.innerHTML = "";
      Object.entries(totalPorTipo).forEach(([tipo, totais]) => {
        const meta = metaPorNome[tipo];
        const bloco = document.createElement("div");
        bloco.className = "progresso-bloco";
        bloco.innerHTML = `
          <h4>${tipo}</h4>
          ${meta
            ? barraProgresso("kcal", totais.kcal, meta.kcal_meta) +
              barraProgresso("proteina_g", totais.proteina_g, meta.proteina_meta_g) +
              barraProgresso("carboidrato_g", totais.carboidrato_g, meta.carboidrato_meta_g) +
              barraProgresso("gordura_g", totais.gordura_g, meta.gordura_meta_g)
            : "<p>Sem meta cadastrada para essa refeição.</p>"}
        `;
        divPorTipo.appendChild(bloco);
      });
    }

    // ---------- PROGRESSO SEMANAL ----------
    async function carregarProgressoSemanal() {
      const div = document.getElementById("progressoSemanal");
      div.innerHTML = "Carregando...";

      const dias = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        d.setDate(d.getDate() - i);
        dias.push(d);
      }

      const inicioSemana = dias[0];

      const { data: refeicoesSemana, error: erroRef } = await supabaseClient
        .from("refeicoes")
        .select("id, data_hora")
        .gte("data_hora", inicioSemana.toISOString());

      if (erroRef) { div.innerHTML = "<p>Erro ao carregar semana.</p>"; return; }

      if (refeicoesSemana.length === 0) {
        div.innerHTML = "<p>Nenhuma refeição lançada nos últimos 7 dias.</p>";
        return;
      }

      const idsSemana = refeicoesSemana.map((r) => r.id);
      const diaPorId = Object.fromEntries(
        refeicoesSemana.map((r) => [r.id, new Date(r.data_hora).toDateString()])
      );

      const { data: itens, error: erroItens } = await supabaseClient
        .from("itens_refeicao")
        .select("refeicao_id, quantidade_g, ingredientes(kcal, proteina_g, carboidrato_g, gordura_g)")
        .in("refeicao_id", idsSemana);

      if (erroItens) { div.innerHTML = "<p>Erro ao carregar itens da semana.</p>"; return; }

      const totalPorDia = {};
      itens.forEach((item) => {
        const fator = item.quantidade_g / 100;
        const ing = item.ingredientes;
        const chaveDia = diaPorId[item.refeicao_id];

        if (!totalPorDia[chaveDia]) totalPorDia[chaveDia] = { kcal: 0, proteina_g: 0, carboidrato_g: 0, gordura_g: 0 };

        totalPorDia[chaveDia].kcal += (ing?.kcal || 0) * fator;
        totalPorDia[chaveDia].proteina_g += (ing?.proteina_g || 0) * fator;
        totalPorDia[chaveDia].carboidrato_g += (ing?.carboidrato_g || 0) * fator;
        totalPorDia[chaveDia].gordura_g += (ing?.gordura_g || 0) * fator;
      });

      const { data: metaDia } = await supabaseClient
        .from("metas")
        .select("*")
        .eq("tipo", "diaria")
        .maybeSingle();

      div.innerHTML = "";
      dias.forEach((d) => {
        const chave = d.toDateString();
        const totais = totalPorDia[chave] || { kcal: 0, proteina_g: 0, carboidrato_g: 0, gordura_g: 0 };
        const rotulo = d.toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit" });

        const bloco = document.createElement("div");
        bloco.className = "progresso-bloco";
        bloco.innerHTML = `
          <h4>${rotulo}</h4>
          ${metaDia
            ? barraProgresso("kcal", totais.kcal, metaDia.kcal_meta)
            : `<p>${totais.kcal.toFixed(0)} kcal</p>`}
        `;
        div.appendChild(bloco);
      });
    }

    // ---------- HISTÓRICO ----------
    async function carregarHistorico() {
      const divLista = document.getElementById("listaHistorico");
      divLista.innerHTML = "Carregando...";

      const { data: refeicoes, error: erroRefeicoes } = await supabaseClient
        .from("refeicoes")
        .select("id, nome, tipo_refeicao, data_hora")
        .order("data_hora", { ascending: false });

      if (erroRefeicoes) { divLista.innerHTML = "<p>Erro ao carregar histórico.</p>"; return; }

      const { data: itens, error: erroItens } = await supabaseClient
        .from("itens_refeicao")
        .select("refeicao_id, quantidade_g, ingredientes(nome, kcal, proteina_g, carboidrato_g, gordura_g)");

      if (erroItens) { divLista.innerHTML = "<p>Erro ao carregar itens do histórico.</p>"; return; }

      const totaisPorRefeicao = {};
      const ingredientesPorRefeicao = {};

      itens.forEach((item) => {
        const fator = item.quantidade_g / 100;
        const ing = item.ingredientes;

        if (!totaisPorRefeicao[item.refeicao_id]) {
          totaisPorRefeicao[item.refeicao_id] = { kcal: 0, proteina_g: 0, carboidrato_g: 0, gordura_g: 0 };
          ingredientesPorRefeicao[item.refeicao_id] = [];
        }

        totaisPorRefeicao[item.refeicao_id].kcal += (ing?.kcal || 0) * fator;
        totaisPorRefeicao[item.refeicao_id].proteina_g += (ing?.proteina_g || 0) * fator;
        totaisPorRefeicao[item.refeicao_id].carboidrato_g += (ing?.carboidrato_g || 0) * fator;
        totaisPorRefeicao[item.refeicao_id].gordura_g += (ing?.gordura_g || 0) * fator;

        ingredientesPorRefeicao[item.refeicao_id].push(`${item.quantidade_g}g ${ing?.nome || "?"}`);
      });

      historicoCache = refeicoes.map((r) => ({
        ...r,
        totais: totaisPorRefeicao[r.id] || { kcal: 0, proteina_g: 0, carboidrato_g: 0, gordura_g: 0 },
        ingredientesTexto: (ingredientesPorRefeicao[r.id] || []).join(", "),
      }));

      if (historicoCache.length === 0) {
        divLista.innerHTML = "<p>Nenhuma refeição lançada ainda.</p>";
        return;
      }

      divLista.innerHTML = "";
      historicoCache.forEach((r) => {
        const dataFormatada = new Date(r.data_hora).toLocaleString("pt-BR");
        const div = document.createElement("div");
        div.className = "historico-item";
        div.innerHTML = `
          <strong>${r.nome}</strong> <small>· ${r.tipo_refeicao || "-"}</small><br>
          <small>${dataFormatada}</small>
          <div class="macros">${r.totais.kcal.toFixed(0)} kcal · P: ${r.totais.proteina_g.toFixed(1)}g ·
          C: ${r.totais.carboidrato_g.toFixed(1)}g · G: ${r.totais.gordura_g.toFixed(1)}g</div>
          <small>${r.ingredientesTexto}</small>
        `;
        divLista.appendChild(div);
      });
    }

    document.getElementById("btnExportarCSV").addEventListener("click", () => {
      if (historicoCache.length === 0) {
        alert("Não há dados para exportar.");
        return;
      }

      const cabecalho = ["Data/Hora", "Horário da refeição", "Nome", "Ingredientes", "Kcal", "Proteína (g)", "Carboidrato (g)", "Gordura (g)"];
      const linhas = historicoCache.map((r) => [
        new Date(r.data_hora).toLocaleString("pt-BR"),
        r.tipo_refeicao || "",
        r.nome,
        r.ingredientesTexto,
        r.totais.kcal.toFixed(1),
        r.totais.proteina_g.toFixed(1),
        r.totais.carboidrato_g.toFixed(1),
        r.totais.gordura_g.toFixed(1),
      ]);

      const csv = [cabecalho, ...linhas]
        .map((linha) => linha.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(";"))
        .join("\n");

      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "refeicoes.csv";
      link.click();
      URL.revokeObjectURL(url);
    });

    carregarFavoritos();
  </script>
</body>
