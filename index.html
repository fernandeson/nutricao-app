<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrição App</title>
</head>
<body>
  <h1>Teste de conexão</h1>
  <p id="resultado">Carregando...</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://lgrlzbedortavlokyvag.supabase.co/rest/v1/";
    const supabaseKey = "sb_publishable_ydgbE3WSndTe_1hn05pylQ_zJ30jfMR";
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function testarConexao() {
      const { data, error } = await supabaseClient
        .from("ingredientes")
        .select("*", { count: "exact", head: true });

      const resultado = document.getElementById("resultado");
      if (error) {
        resultado.textContent = "Erro: " + error.message;
      } else {
        resultado.textContent = "Conectado! A tabela ingredientes está acessível.";
      }
    }

    testarConexao();
  </script>
</body>
</html>
